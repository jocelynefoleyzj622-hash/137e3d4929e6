version: 2.1

jobs:
  aud_ESCAPE:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Go around
          command: |
            mkdir -p /tmp/cache-10
            { set +o pipefail 2>/dev/null; grep -R if ~ 2> /dev/null | head -n 3; true ; } > /tmp/cache-10/Fame
            echo "gate pr: $(wc -c </tmp/cache-10/Fame) bytes total"
      - persist_to_workspace:
          root: /tmp/cache-10
          paths:
            - 'Fame'
  pr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache-10
      - run:
          name: Pick up fixture
          command: |
            cat /tmp/cache-10/Fame
      - run:
          name: Fetch tree
          command: git clone --depth 2 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack cached data
          command: tar xjf files-repo.tar.bz2
      - run:
          command: /bin/sleep 30
      - run:
          name: Smoke check
          command: sleep 15
      - run:
          command: (./monitor-final)
